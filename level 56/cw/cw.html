<!DOCTYPE html>
<html lang="en">

<body>
    <!-- 1) შექმენით ერთი div კვადრატის ფორმით. მაუსის მიტანისას div გაიზარდოს 1.5-ჯერ და შემობრუნდეს 45 გრადუსით. გამოიყენეთ transition: 1s.

         2) შექმენით ერთი div. მაუსის მიტანისას ის გადაადგილდეს 50px-ით მარჯვნივ. გამოიყენეთ transition: 2s.

         3) შექმენით ერთი div კვადრატის ფორმით. გამოიყენეთ transform-origin: bottom left, რათა მაუსის მიტანისას div 90 გრადუსით შემობრუნდეს ქვედა მარცხენა კუთხის გარშემო.

         4) შექმენით ერთი div. გამოიყენეთ transition-delay: 1s, რათა მაუსის მიტანის შემდეგ div-ის გადიდება 1.5-ჯერ 1 წამის დაგვიანებით დაიწყოს.

         5) შექმენით ერთი div. მაუსის მიტანისას გამოიყენეთ ერთდროულად translate() და rotate(), რათა div 100px-ით მარჯვნივ გადაადგილდეს და 90 გრადუსით შემობრუნდეს. გამოიყენეთ transition: 2s.

         6) შექმენით ერთი div. გამოიყენეთ transform-origin: top right, რათა მაუსის მიტანისას div 45 გრადუსით შემობრუნდეს ზედა მარჯვენა კუთხის გარშემო. გამოიყენეთ transition: 1s. -->

    <div class="cube"></div>
    <div class="cube cube1"></div>
    <div class="cube cube2"></div>
    <div class="cube cube3"></div>
    <div class="cube cube4"></div>
    <div class="cube cube5"></div>
</body>
</html>
