    <!-- 1) ჩამოწერეთ ნასწავლი position-ები და ახსენი თუ რას აკეთებს თითოეული.

    static - default
    relative - არის პოზიცია რომელიც გადაადგილებს მითითებულ ელემენტს მხოლოდ გარეგნობით მაგრამ სინამდვილეში ისევ იქ დგას და არ განძრეულა
    fixed - კონკრეტული ელემენტი ეტყუპება ეკრანის რაღაც ნაწილს (იმდროსაც როცა სქროლავ დაბლა მაუსით)
    absolute - უკვე ნამდვილად გადაადგილებს მითითებულ ელემენტს გარეგნობითაც და რეალურადაც
    sticky - როდესაც სწვდები კონკრეტულად იმ ელემენტს რომელსაც სტიკი აქვს მითითებული ფიქსედივით ეწეპება ეკრანს

    2) შექმენით div-ი და გაუწერეთ მას border,სიმაღლე 300px და სიგანე 350px. მასში შექმენით კიდევ ერთი div-ი რომელსაც გაუწერთ background color-ს,სიმაღლეს 50px-ს და სიგანე 60px-ს. position absolute გამოყენებით შვილი div მოათავსეთ მშობელი div-ის ზედა მარჯვენა კუთხეში.
    
    3) შექმენით პროდუქტის მარტივი ბარათი. ბარათში უნდა იყოს პროდუქტის ფოტო, ფოტოს ქვემოთ ყიდვის ღილაკი და ფოტოს ზედა მარცხენა კუთხეში position absolute ის გამოყენებით გამოიტანეთ პროდუქტის ფასი.

    4) body-ს გაუწერეთ height 300vh,შემდეგ კი შექმენით ღილაკი რომელიც იქნება საიტის ზედა მარჯვენა კუთხეში და დარჩება იქ ჩამოსქროლვის დროსაც.

    5) შექმენით div-ი რომელსაც გაუწერთ სიმაღლეს 200px-ს,სიგანეს 300px-ს და position relative-ს. მასში ჩასვი რაიმე ფოტო რომელსაც გაუწერ სიმაღლეს 100%-ს და სიგანეს 100%-ს. position absolute-ის გამოყენებით კი ფოტოს ქვედა მარჯვენა კუთხეში გამოიტანეთ read more ღილაკი. -->
    <div id="Test"><div id="ct"></div></div><br><br><br><br><br><br>
